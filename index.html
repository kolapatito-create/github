<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Codificación y adaptación a pantallas móviles -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Práctica Web</title>

  <!-- Vinculación de la hoja de estilos -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Enlace para saltar al contenido (accesibilidad con teclado) -->
  <a class="skip-link" href="#login-form">Saltar al formulario</a>

  <main class="page">
    <section class="card" aria-labelledby="titulo">

      <!-- Encabezado de la tarjeta -->
      <header class="card__header">
        <div class="logo" aria-hidden="true">
          <!-- Icono de escudo (seguridad) -->
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5l8-3z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <h1 id="titulo">Bienvenido de nuevo</h1>
        <p class="card__subtitle">Ingresa tus datos para acceder a tu cuenta</p>
      </header>

      <!-- novalidate: desactiva la validación del navegador para usar la nuestra en JavaScript -->
      <form id="login-form" novalidate>

        <!-- Campo: correo electrónico -->
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
              </svg>
            </span>
            <input type="email" id="email" name="email" placeholder="demo@ejemplo.com"
                   autocomplete="email" aria-describedby="email-error" />
          </div>
          <p class="error" id="email-error" role="alert"></p>
        </div>

        <!-- Campo: contraseña -->
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="11" width="16" height="10" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
                   autocomplete="current-password" aria-describedby="password-error" />
            <!-- Botón mostrar / ocultar contraseña -->
            <button type="button" id="toggle-password" class="toggle" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="error" id="password-error" role="alert"></p>
        </div>

        <!-- Opciones: recordar correo y recuperar contraseña -->
        <div class="options">
          <label class="check">
            <input type="checkbox" id="remember" />
            <span>Recordar mi correo</span>
          </label>
          <a href="#" id="forgot" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón principal -->
        <button type="submit" class="btn">Iniciar sesión</button>

        <!-- Mensajes de resultado (confirmación, bienvenida o error) -->
        <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      </form>

      <footer class="card__footer">
        <p>Credenciales de prueba: <strong>demo@ejemplo.com</strong> / <strong>Demo1234!</strong></p>
      </footer>
    </section>
  </main>

  <!-- Vinculación del script (al final para que el DOM ya exista) -->
  <script src="script.js"></script>
</body>
</html>
